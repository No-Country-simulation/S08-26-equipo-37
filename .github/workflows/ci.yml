name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|refactor|test|chore|build|ci|perf|style)(\([a-z0-9][a-z0-9._/-]*\))?!?: [A-Za-z0-9].+$'

          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::Pull request title must follow Conventional Commits."
            echo "Expected: <type>(<optional-scope>): <description>"
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run static checks
        run: npm run check

      - name: Build application
        run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://predictive-maintenance.smacaya.tech
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          status_code="$(
            curl --silent --show-error \
              --output /tmp/coolify-response \
              --write-out "%{http_code}" \
              --request POST "$COOLIFY_DEPLOY_WEBHOOK" \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          )"

          cat /tmp/coolify-response

          if [[ "$status_code" != 2* ]]; then
            echo "Coolify webhook returned HTTP $status_code" >&2
            exit 1
          fi
