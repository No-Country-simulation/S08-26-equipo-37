name: Dataset

on:
  pull_request:
    paths:
      - "datos/**"
      - "ml/**"
      - ".gitattributes"
      - "scripts/validate-dataset.mjs"
      - "package.json"
      - ".github/workflows/dataset.yml"
  push:
    branches:
      - main
    paths:
      - "datos/**"
      - "ml/**"
      - ".gitattributes"
      - "scripts/validate-dataset.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dataset:
    runs-on: ubuntu-latest
    steps:
      # The dataset is stored with Git LFS: without `lfs: true` the checkout
      # leaves a three-line pointer and the validation would check that instead.
      - name: Check out repository with Git LFS
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # No dependencies are installed: the validator only uses the Node.js
      # standard library, which keeps this job fast and cheap.
      - name: Validate dataset integrity
        run: npm run data:validate
